<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atenvo — Plataforma de Atendimento e Gestão</title>
    <!-- Fonte agora é self-hosted via @fontsource/inter (ATENVO-DESIGN.md §5 proíbe
         Google Fonts em runtime). Pesos: só 400 e 500. O JetBrains Mono saiu junto —
         o pouco que usava --mono cai no monoespaçado do sistema até a tela migrar. -->
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('atenvo-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
