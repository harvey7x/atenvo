<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: habilita env(safe-area-inset-*) no app instalado (standalone);
         interactive-widget=resizes-content: o teclado do Android ENCOLHE o viewport em vez
         de cobrir o campo de digitação (Chrome ≥108). Desktop ignora os dois. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iPhone: "Adicionar à Tela de Início" abre em tela cheia mesmo em iOS antigo
         (que ignora o display do manifest); status bar translúcida sobre o fundo escuro. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atenvo" />
    <title>Atenvo — Plataforma de Atendimento e Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = 'light';
        try { var s = localStorage.getItem('atenvo-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
